name: Publish Signed In-App Update

on:
  push:
    branches: [main]
    paths: ['version.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vyapar-signed-in-app-update
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Read version
        id: version
        shell: bash
        run: |
          echo "name=$(node -p "require('./version.json').versionName")" >> "$GITHUB_OUTPUT"
          echo "code=$(node -p "require('./version.json').versionCode")" >> "$GITHUB_OUTPUT"
      - name: Require permanent signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SP: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$KS" && test -n "$ALIAS" && test -n "$KP" && test -n "$SP" || { echo 'Permanent Android signing secrets are required for safe in-app updates.'; exit 1; }
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with: {gradle-version: '8.7'}
      - name: Decode keystore
        env: {KS: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}'}
        run: printf '%s' "$KS" | base64 --decode > "$RUNNER_TEMP/vyapar-release.jks"
      - name: Build frontend and verify
        run: npm run build && npm run verify
      - name: Build signed release APK
        working-directory: android-app
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PANDROID_KEYSTORE_FILE="$RUNNER_TEMP/vyapar-release.jks" -PANDROID_KEY_ALIAS="$ANDROID_KEY_ALIAS" -PANDROID_KEY_PASSWORD="$ANDROID_KEY_PASSWORD" -PANDROID_STORE_PASSWORD="$ANDROID_STORE_PASSWORD" -PGOOGLE_WEB_CLIENT_ID="${{ secrets.GOOGLE_WEB_CLIENT_ID }}" --no-daemon
      - name: Verify and prepare APK
        id: apk
        shell: bash
        run: |
          APK=android-app/app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose --print-certs "$APK"
          NAME="VyaparAI-${{ steps.version.outputs.name }}.apk"
          cp "$APK" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "$NAME" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          TAG="v${{ steps.version.outputs.name }}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && { echo "Release already exists"; exit 1; } || true
          gh release create "$TAG" "${{ steps.apk.outputs.name }}" --repo "$GITHUB_REPOSITORY" --target main --title "Vyapar AI $TAG - In-App Update" --notes-file "RELEASE_${{ steps.version.outputs.name }}.md"
      - name: Approve release for in-app updater
        env: {SHA: '${{ steps.apk.outputs.sha }}'}
        shell: bash
        run: |
          python - <<'PY'
          import json,os,datetime
          from pathlib import Path
          v=json.loads(Path('version.json').read_text())
          name=v['versionName']; code=v['versionCode']
          notes=Path(f'RELEASE_{name}.md').read_text().splitlines()[2:]
          notes='\n'.join(x.strip().lstrip('- ').strip() for x in notes if x.strip())
          m={'schemaVersion':1,'enabled':True,'appId':'com.anuj.guptalegacy.vyaparai','channel':'stable','versionName':name,'versionCode':code,'minimumSupportedVersionCode':0,'mandatory':False,'apkUrl':f'https://github.com/artishoepalace-oss/Vyapar-AI-Fronted-/releases/download/v{name}/VyaparAI-{name}.apk','sha256':os.environ['SHA'],'releaseNotes':notes,'publishedAt':datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')}
          Path('update.json').write_text(json.dumps(m,indent=2)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add update.json
          git commit -m "[skip ci] Approve in-app update ${{ steps.version.outputs.name }}"
          git push origin HEAD:main
