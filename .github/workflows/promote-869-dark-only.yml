name: Promote Vyapar AI 8.6.9.2026 Dark Only

on:
  push:
    branches: [main]
    paths:
      - '.release/READY-8692026'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  promote-dark-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore clean 8.6.7 source baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f .release/READY-8692026
          cp .github/workflows/promote-869-dark-only.yml /tmp/promote-869-dark-only.yml
          cp -a .release /tmp/release869
          git rm -rf .
          git archive 01b072d7cb4b476410f928add945916de48792a1 | tar -x
          mkdir -p .github/workflows .release
          cp /tmp/promote-869-dark-only.yml .github/workflows/promote-869-dark-only.yml
          cp -a /tmp/release869/. .release/

      - name: Decode and apply exact 8.6.9 source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .release/patch869.xz.part* | base64 -d | xz -d > /tmp/patch869.diff
          git apply --check /tmp/patch869.diff
          git apply --binary /tmp/patch869.diff

      - name: Validate dark-only 8.6.9 source
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const root = JSON.parse(fs.readFileSync('version.json','utf8'));
          const web = JSON.parse(fs.readFileSync('web/version.json','utf8'));
          const gradle = fs.readFileSync('android-app/app/build.gradle','utf8');
          const vn = (gradle.match(/versionName\s+["']([^"']+)/)||[])[1];
          const vc = Number((gradle.match(/versionCode\s+(\d+)/)||[])[1]);
          if (root.versionName !== '8.6.9.2026' || Number(root.versionCode) !== 8692026) throw new Error('root version mismatch');
          if (web.versionName !== '8.6.9.2026' || Number(web.versionCode) !== 8692026 || web.version !== '8.6.9.2026') throw new Error('web version mismatch');
          if (vn !== '8.6.9.2026' || vc !== 8692026) throw new Error('Gradle version mismatch');
          NODE
          if grep -RIl --exclude='*.md' --exclude-dir='.git' 'theme-light' web frontend-source android-app/app/src/main/assets | grep -q .; then
            echo 'theme-light code remains' >&2
            exit 1
          fi
          if grep -RIl --include='*.js' --include='*.html' -E 'theme-toggle|toggleTheme|setTheme\(.light|prefers-color-scheme.*light' web frontend-source android-app/app/src/main/assets | grep -q .; then
            echo 'theme switching code remains' >&2
            exit 1
          fi
          grep -q 'android:icon="@drawable/ic_launcher"' android-app/app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@drawable/ic_launcher"' android-app/app/src/main/AndroidManifest.xml
          test ! -e android-app/app/src/main/res/drawable/ic_launcher_round.xml
          test ! -e android-app/app/src/main/res/drawable-v26/ic_launcher_round.xml
          test ! -e frontend-source/android/styles/premium-light-864.css
          test ! -e frontend-source/android/styles/profile-light-863.css
          for f in android-app/app/src/main/assets/*.js; do node --check "$f"; done
          node --check web/app.js
          node --check web/assets/scripts/vyapar-app.js
          node --check frontend-source/android/scripts/app.js

      - name: Commit production source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release
          rm -f .github/workflows/promote-869-dark-only.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release Vyapar AI 8.6.9.2026 dark-only UI and rounded-square launcher'
          git push origin HEAD:main
