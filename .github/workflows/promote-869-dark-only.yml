name: Prepare Vyapar AI 8.6.9 Intermediate

on:
  push:
    branches: [main]
    paths:
      - '.release/READY-869DIAG'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-intermediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore clean 8.6.7 source baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f .release/READY-869DIAG
          cp -a .release /tmp/release869
          git rm -rf .
          git archive 01b072d7cb4b476410f928add945916de48792a1 | tar -x
          mkdir -p .release
          cp -a /tmp/release869/. .release/

      - name: Apply staged 8.6.9 source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .release/minpatch869.part* | base64 -d | xz -d > /tmp/minpatch869.diff
          git apply --check /tmp/minpatch869.diff
          git apply --binary /tmp/minpatch869.diff

      - name: Rebuild Android frontend bundles
        run: node tools/build-frontend-bundles.mjs

      - name: Pack intermediate source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release
          tar --exclude=.git -czf /tmp/vyapar-869-intermediate.tar.gz .

      - name: Upload intermediate source
        uses: actions/upload-artifact@v4
        with:
          name: vyapar-869-intermediate
          path: /tmp/vyapar-869-intermediate.tar.gz
          retention-days: 1
