name: Promote Vyapar AI 20.10.2004.00007.2026

on:
  push:
    branches: [main]
    paths:
      - '.release/READY-UI007'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: vyapar-ui007-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reassemble and verify exact 00007 payload
        shell: bash
        run: |
          set -euo pipefail
          test -f .release/READY-UI007
          test -f .release/00007/app.patch.gz
          cat .release/00007/payload.* > /tmp/vyapar-00007-critical.tar.xz
          echo 'ca2a7c729f92800c303e1be2da111b0dd12a7c610563f7fea17c8343744d7c9a  /tmp/vyapar-00007-critical.tar.xz' | sha256sum -c -
          tar -xJf /tmp/vyapar-00007-critical.tar.xz -C .
          git cat-file blob 01f12f74ac072cf1d37af08ee7324424a0991244 > frontend-source/android/scripts/app.js
          gzip -dc .release/00007/app.patch.gz > /tmp/app-00007.patch
          git apply --check /tmp/app-00007.patch
          git apply /tmp/app-00007.patch

      - name: Verify exact 00007 canonical source
        shell: bash
        run: |
          set -euo pipefail
          check_blob() { actual="$(git hash-object "$1")"; test "$actual" = "$2" || { echo "SHA mismatch: $1 $actual != $2"; exit 1; }; }
          check_blob frontend-source/android/scripts/app.js 8d9d574bbd1bdfb8b28b24efbf852e4e7efe018c
          check_blob tools/build-frontend-bundles.mjs 47d5369d6c52069e4bd0635a96891a5e89eda57f
          check_blob frontend-source/android/styles/workspace-v7.css f4d683050ad30a47052def7ee6200662566b57e1
          check_blob frontend-source/android/scripts/data-store.js d6539876ece3b4c936c315252fa04577faa25a4e
          check_blob frontend-source/android/scripts/workspace-startup.js f19cf401d0a64b474ea3148902539adb738cb074
          check_blob android-app/app/src/main/java/com/vyaparai/app/MainActivity.java 130273a943853e1c4af79787a27087dd1147a053
          check_blob tests/motion-navigation.test.js 7bd3953d4f83bdf4acd695115837506b08069fa9
          check_blob tests/professional-ui-682.test.js fef67e14a8d368ef54e4fc8bee718a1ca737b619
          check_blob tests/settings-center-675.test.js d13a61a9fd689db06d1dde29627c7629df3e8d6a
          check_blob tests/settings-overlap-858.test.js d09d1c8d1f41297197c7059f2c9cb194dc827e46
          check_blob version.json fb40bac7d25dc4672303e07d26b4b62a5a993ba7
          grep -q '20.10.2004.00007.2026' version.json
          grep -q 'versionCode 2010200407' android-app/app/build.gradle

      - name: Rebuild and run full 00007 verification
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run verify

      - name: Commit verified 00007 source to main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release
          rm -f .github/workflows/import-source.yml .github/workflows/promote-ui-organized.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Release Vyapar AI 20.10.2004.00007.2026 full source sync'
          git push origin HEAD:main
