name: Export Vyapar AI Source Archive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read version and create source archive
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./version.json').versionName")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          git archive --format=zip --output="dist/Vyapar-AI-Frontend-${VERSION}.zip" HEAD

      - name: Upload source archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vyapar-AI-Frontend-${{ steps.version.outputs.version }}
          path: dist/Vyapar-AI-Frontend-${{ steps.version.outputs.version }}.zip
          retention-days: 14
