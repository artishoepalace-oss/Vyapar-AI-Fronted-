name: Create GitHub Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import json
          with open('version.json', 'r', encoding='utf-8') as f:
              print(json.load(f)['versionName'])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create source archive
        shell: bash
        run: |
          mkdir -p dist
          git archive --format=zip --output="dist/Vyapar-AI-Frontend-${{ steps.version.outputs.version }}.zip" HEAD

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/Vyapar-AI-Frontend-${VERSION}.zip" --clobber
          else
            gh release create "$TAG" \
              "dist/Vyapar-AI-Frontend-${VERSION}.zip" \
              --title "Vyapar AI Frontend ${VERSION}" \
              --notes "Vyapar AI Frontend ${VERSION} release."
          fi
