name: Import Vyapar AI 6.5.9 exact source

on:
  push:
    branches: [main]
    paths:
      - '.source-transfer/READY-659'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble exact source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f .source-transfer/READY-659
          cat .source-transfer/v659-* > /tmp/vyapar-659.zip.b64
          base64 -d /tmp/vyapar-659.zip.b64 > /tmp/vyapar-659.zip
          echo '47c8ac84eec30daf91f8dce7a0d1b4902cce46601264f6b5c990933ff676290e  /tmp/vyapar-659.zip' | sha256sum -c -
          rm -rf /tmp/vyapar-659-import
          mkdir -p /tmp/vyapar-659-import
          unzip -q /tmp/vyapar-659.zip -d /tmp/vyapar-659-import
          SOURCE_ROOT="$(find /tmp/vyapar-659-import -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$SOURCE_ROOT"
          test -f "$SOURCE_ROOT/version.json"
          test -d "$SOURCE_ROOT/android-app"
          echo "SOURCE_ROOT=$SOURCE_ROOT" >> "$GITHUB_ENV"

      - name: Import exact source tree
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.source-transfer/' \
            "$SOURCE_ROOT/" ./
          rm -rf .source-transfer .source-v2 .full-transfer .bootstrap

      - name: Validate imported version and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const version = JSON.parse(fs.readFileSync('version.json','utf8'));
          if (version.versionName !== '6.5.9' || Number(version.versionCode) !== 65900) {
            throw new Error(`Unexpected version ${version.versionName}/${version.versionCode}`);
          }
          console.log('Imported version:', version.versionName, version.versionCode);
          NODE
          for f in android-app/app/src/main/assets/*.js; do node --check "$f"; done

      - name: Commit exact 6.5.9 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'Release Vyapar AI 6.5.9 iOS Motion Liquid Glass'
            git push origin HEAD:main
          fi

      - name: Start Android APK build and release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run build-android.yml --ref main
