name: Import Vyapar AI 6.7.0.2026 phase 3.1 hotfix

on:
  push:
    branches: [main]
    paths:
      - '.source-transfer/READY-6702026'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble verified phase 3.1 hotfix patch
        shell: bash
        run: |
          set -euo pipefail
          test -f .source-transfer/READY-6702026
          cat .source-transfer/v6702026-patch-* > /tmp/v6702026-patch.tar.xz.b64
          base64 -d /tmp/v6702026-patch.tar.xz.b64 > /tmp/v6702026-patch.tar.xz
          echo '7f8509b49b6971b8c1efc75c4ba6cdedc778134ee2cf4ca650e96354a5d1dc5c  /tmp/v6702026-patch.tar.xz' | sha256sum -c -
          tar -xJf /tmp/v6702026-patch.tar.xz -C .

      - name: Validate promoted release source
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const v = JSON.parse(fs.readFileSync('version.json','utf8'));
          const w = JSON.parse(fs.readFileSync('web/version.json','utf8'));
          const gradle = fs.readFileSync('android-app/app/build.gradle','utf8');
          const versionName = (gradle.match(/versionName\s+["']([^"']+)/)||[])[1];
          const versionCode = Number((gradle.match(/versionCode\s+(\d+)/)||[])[1]);
          if (v.versionName !== '6.7.0.2026' || Number(v.versionCode) !== 6702026) throw new Error(`Unexpected root version ${v.versionName}/${v.versionCode}`);
          if (w.versionName !== '6.7.0.2026' || Number(w.versionCode) !== 6702026 || w.version !== '6.7.0.2026') throw new Error('Web version mismatch');
          if (versionName !== '6.7.0.2026' || versionCode !== 6702026) throw new Error(`Gradle version mismatch ${versionName}/${versionCode}`);
          console.log('Version sync OK:', v.versionName, v.versionCode);
          NODE
          for f in web/*.js android-app/app/src/main/assets/*.js; do node --check "$f"; done
          if [ -d tests ]; then node --test tests/*.test.js; fi
          test -f web/production-ui-670p1.css
          test -f web/workflow-ui-670p2.css
          test -f tests/phase31-ui-hotfix.test.js

      - name: Commit phase 3.1 hotfix as v6.7.0.2026
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .source-transfer
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release Vyapar AI v6.7.0.2026 from phase 3.1 hotfix'
          git push origin HEAD:main

      - name: Start Android APK build and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run build-android.yml --ref main
