name: Build Vyapar AI 6.5.9 now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-659-now.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Validate 6.5.9 source
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const v=JSON.parse(fs.readFileSync('version.json','utf8'));
          if(v.versionName!=='6.5.9'||Number(v.versionCode)!==65900) throw new Error('Expected 6.5.9/65900');
          const g=fs.readFileSync('android-app/app/build.gradle','utf8');
          if(!/versionCode\s+65900/.test(g)||!/versionName\s+['"]6\.5\.9['"]/.test(g)) throw new Error('Android version mismatch');
          NODE
          for f in android-app/app/src/main/assets/*.js; do node --check "$f"; done

      - name: Generate Gradle wrapper
        working-directory: android-app
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Build debug APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug -PGOOGLE_WEB_CLIENT_ID="${{ secrets.GOOGLE_WEB_CLIENT_ID }}" --stacktrace --no-daemon

      - name: Prepare APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk VyaparAI-6.5.9.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.5.9
          name: Vyapar AI v6.5.9
          generate_release_notes: true
          files: VyaparAI-6.5.9.apk

      - name: Cleanup one-time workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/build-659-now.yml
          git commit -m 'Clean one-time 6.5.9 release workflow'
          git push origin HEAD:main
