name: Cleanup 00009 Production

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove release staging files and verify repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release
          npm run build
          npm run verify

      - name: Commit staging cleanup to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Remove temporary 00009 release staging files'
            git push origin HEAD:main
          fi
