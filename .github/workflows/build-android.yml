name: CI - Vyapar AI Android

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vyapar-main-ci
  cancel-in-progress: true

jobs:
  verify-android:
    name: Verify and build debug artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Align runtime metadata in CI workspace
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re
          version = json.loads(Path('version.json').read_text(encoding='utf-8'))
          name = version['versionName']
          code = str(version['versionCode'])
          cache = f'{code}-workspace1'
          for path in [Path('web/index.html'), Path('android-app/app/src/main/assets/index.html')]:
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'<meta name="vyapar-ui-version" content="[^"]+"\s*/>', f'<meta name="vyapar-ui-version" content="{name}" />', text, count=1)
              text = re.sub(r'assets/styles/vyapar-core\.css\?v=[^"]+', f'assets/styles/vyapar-core.css?v={cache}', text, count=1)
              text = re.sub(r'assets/styles/vyapar-ui\.css\?v=[^"]+', f'assets/styles/vyapar-ui.css?v={cache}', text, count=1)
              text = re.sub(r'assets/scripts/vyapar-app\.js\?v=[^"]+', f'assets/scripts/vyapar-app.js?v={cache}', text, count=1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Rebuild and verify frontend runtime
        run: npm run build && npm run verify

      - name: Verify Android release identity
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const v=JSON.parse(fs.readFileSync('version.json','utf8'));
          const g=fs.readFileSync('android-app/app/build.gradle','utf8');
          const name=(g.match(/versionName\s+["']([^"']+)/)||[])[1];
          const code=Number((g.match(/versionCode\s+(\d+)/)||[])[1]);
          if(name!==v.versionName || code!==Number(v.versionCode)) throw new Error(`Version mismatch: ${name}/${code} vs ${v.versionName}/${v.versionCode}`);
          NODE

      - name: Generate Gradle wrapper
        working-directory: android-app
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Build debug APK for CI only
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug -PGOOGLE_WEB_CLIENT_ID="${{ secrets.GOOGLE_WEB_CLIENT_ID }}" --stacktrace --no-daemon

      - name: Upload CI APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VyaparAI-${{ github.sha }}-debug-ci
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
