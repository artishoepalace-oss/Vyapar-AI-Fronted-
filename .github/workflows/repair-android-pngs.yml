name: Repair Android PNG Resources

on:
  push:
    branches:
      - main
    paths:
      - '.github/repair-png-trigger'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Re-encode mislabeled image resources as real PNG
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          paths = [
              Path('android-app/app/src/main/res/drawable/ic_launcher.png'),
              Path('android-app/app/src/main/res/drawable/ic_launcher_512.png'),
              Path('android-app/app/src/main/res/drawable-nodpi/startup_logo.png'),
          ]
          for path in paths:
              with Image.open(path) as image:
                  image.load()
                  mode = 'RGBA' if 'A' in image.getbands() else 'RGB'
                  converted = image.convert(mode)
                  converted.save(path, format='PNG', optimize=True)
              signature = path.read_bytes()[:8]
              if signature != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{path} is still not a valid PNG')
              print(f'Normalized {path}')
          PY

      - name: Commit repaired binary resources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-app/app/src/main/res/drawable/ic_launcher.png \
                  android-app/app/src/main/res/drawable/ic_launcher_512.png \
                  android-app/app/src/main/res/drawable-nodpi/startup_logo.png
          git commit -m 'Fix Android PNG resource encoding'
          git push origin HEAD:main
