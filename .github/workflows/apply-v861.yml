name: Apply Vyapar AI 8.6.1 Flat Black

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-v861.yml

permissions:
  contents: write
  actions: write

jobs:
  apply-v861:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact v8.6.1 source
        shell: bash
        run: |
          set -euo pipefail
          cat .github/v861/patch.part1 .github/v861/patch.part2fix .github/v861/patch.part3 \
            | base64 -d | gzip -d > /tmp/v861.patch
          git apply --check /tmp/v861.patch
          git apply /tmp/v861.patch

          find android-app/app/src/main/assets/assets/scripts -maxdepth 1 -type f ! -name 'vyapar-app.js' -delete
          find android-app/app/src/main/assets/assets/styles -maxdepth 1 -type f \
            ! -name 'vyapar-core.css' ! -name 'vyapar-ui.css' -delete

          rm -f frontend-source/android/scripts/apple-motion-852.js \
                frontend-source/android/scripts/apple-motion-853.js \
                frontend-source/android/scripts/apple-stability-855.js \
                frontend-source/android/scripts/apple-unified-854-js-part*.js \
                frontend-source/android/scripts/ios-hig-blur-860.js \
                frontend-source/android/scripts/ios-liquid-unified-858.js \
                frontend-source/android/scripts/ios27-convex-857.js \
                frontend-source/android/scripts/liquid-glass-v2-859.js \
                frontend-source/android/scripts/liquid-lens-motion-856.js

          rm -f frontend-source/android/styles/apple-liquid-852.css \
                frontend-source/android/styles/apple-liquid-853.css \
                frontend-source/android/styles/apple-stability-855.css \
                frontend-source/android/styles/apple-unified-854-part*.css \
                frontend-source/android/styles/ios-hig-blur-860.css \
                frontend-source/android/styles/ios-liquid-unified-858.css \
                frontend-source/android/styles/ios27-convex-857*.css \
                frontend-source/android/styles/liquid-glass-v2-859.css \
                frontend-source/android/styles/liquid-lens-legacy-856.css \
                frontend-source/android/styles/liquid-lens-motion-856.css

          rm -f web/assets/scripts/ios-hig-blur-860.js web/assets/styles/ios-hig-blur-860.css

          node tools/build-frontend-bundles.mjs

          mkdir -p web/assets/scripts web/assets/styles
          cp android-app/app/src/main/assets/assets/scripts/vyapar-app.js web/assets/scripts/vyapar-app.js
          cp android-app/app/src/main/assets/assets/styles/vyapar-core.css web/assets/styles/vyapar-core.css
          cp android-app/app/src/main/assets/assets/styles/vyapar-ui.css web/assets/styles/vyapar-ui.css
          cp frontend-source/android/scripts/auth.js web/assets/scripts/auth.js
          cp frontend-source/android/scripts/settings-center-675.js web/assets/scripts/settings-center-675.js
          cp frontend-source/android/scripts/flat-black-ios-861.js web/assets/scripts/flat-black-ios-861.js
          cp frontend-source/android/styles/flat-black-ios-861.css web/assets/styles/flat-black-ios-861.css

          node --test tests/*.test.js

          git rm -r -f .github/v861 .github/workflows/apply-v861.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release Vyapar AI 8.6.1 flat black universal UI'
          git push origin HEAD:main

      - name: Trigger Android APK workflow
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-android.yml --ref main
