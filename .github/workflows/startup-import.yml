name: Apply Vyapar AI 8.6.9 startup fixes

on:
  push:
    branches: [main]
    paths:
      - '.startup-import/**'

permissions:
  contents: write

jobs:
  import-startup-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore startup-fixed source
        shell: bash
        run: |
          set -euo pipefail
          cat .startup-import/chunk-* | base64 -d > /tmp/startup-import.tar.xz
          tar -xJf /tmp/startup-import.tar.xz -C .

          for script in android-session-flow-647.js auth.js platform-android.js security-ui-643.js; do
            cp "frontend-source/android/scripts/$script" "frontend-source/android/legacy-root-mirrors/scripts/$script"
            cp "frontend-source/android/scripts/$script" "web/$script"
            cp "frontend-source/android/scripts/$script" "web/assets/scripts/$script"
            cp "frontend-source/android/scripts/$script" "android-app/app/src/main/assets/$script"
          done
          cp frontend-source/android/scripts/flat-black-ios-861.js web/assets/scripts/flat-black-ios-861.js

          node tools/build-frontend-bundles.mjs
          cp android-app/app/src/main/assets/assets/scripts/vyapar-app.js web/assets/scripts/vyapar-app.js

      - name: Validate startup fixes
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/startup-session.test.js tests/login-auth-ui.test.js tests/phase3-integrity.test.js tests/phase31-ui-hotfix.test.js
          node --check android-app/app/src/main/assets/assets/scripts/vyapar-app.js
          node --check web/assets/scripts/vyapar-app.js

      - name: Commit startup-fixed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Apply Vyapar AI 8.6.9 startup fixes'
          git push origin HEAD:main
