name: Build Vyapar AI 6.8 Non-Main APK Release

on:
  push:
    branches:
      - release/v6.8.0.2026-english-colorful
    paths:
      - '.github/workflows/build-release-680-nonmain.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Materialize, Validate, Build and Release v6.8.0.2026
    runs-on: ubuntu-latest

    steps:
      - name: Checkout non-main release branch
        uses: actions/checkout@v4
        with:
          ref: release/v6.8.0.2026-english-colorful
          fetch-depth: 0

      - name: Materialize exact v6.8.0.2026 source
        shell: bash
        run: |
          set -euo pipefail
          python3 .release-680/materialize680.py
          rm -rf .release-680
          rm -f .github/workflows/build-release-680-nonmain.yml

      - name: Validate source and English-only runtime
        shell: bash
        run: |
          set -euo pipefail
          for f in web/*.js android-app/app/src/main/assets/*.js; do
            node --check "$f"
          done
          node tests/settings-center-675.test.js
          node tests/phase31-ui-hotfix.test.js
          node tests/phase3-integrity.test.js
          cmp -s web/complete-ui-680.css android-app/app/src/main/assets/complete-ui-680.css
          cmp -s web/complete-ui-680.js android-app/app/src/main/assets/complete-ui-680.js
          if grep -RInP '[\x{0900}-\x{097F}]' \
            web android-app/app/src/main/assets \
            --include='*.html' --include='*.css' --include='*.js'; then
            echo 'Devanagari text remains in runtime assets.' >&2
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          const version = JSON.parse(fs.readFileSync('version.json','utf8'));
          const gradle = fs.readFileSync('android-app/app/build.gradle','utf8');
          if (version.versionName !== '6.8.0.2026' || Number(version.versionCode) !== 6802026) throw new Error('Root version mismatch');
          if (!gradle.includes('versionCode 6802026') || !gradle.includes('versionName "6.8.0.2026"')) throw new Error('Android version mismatch');
          console.log('v6.8.0.2026 version consistency passed');
          NODE

      - name: Commit clean v6.8 source to non-main branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release v6.8.0.2026 English colorful UI on non-main branch'
          git push origin HEAD:release/v6.8.0.2026-english-colorful

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Detect native C++ / JNI configuration
        id: native
        shell: bash
        run: |
          set -euo pipefail
          if [ -f android-app/app/src/main/cpp/CMakeLists.txt ]; then
            echo "kind=cmake" >> "$GITHUB_OUTPUT"
          elif [ -f android-app/app/src/main/jni/Android.mk ]; then
            echo "kind=ndk-build" >> "$GITHUB_OUTPUT"
          elif find android-app/app/src/main -type f \
            \( -name '*.cpp' -o -name '*.cc' -o -name '*.c' -o -name '*.h' -o -name '*.hpp' \) \
            -print -quit | grep -q .; then
            echo 'JNI/C++ source exists without CMakeLists.txt or Android.mk.' >&2
            exit 1
          else
            echo "kind=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Install native toolchain when JNI exists
        if: steps.native.outputs.kind != 'none'
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper
        working-directory: android-app
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Build debug APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug \
            -PGOOGLE_WEB_CLIENT_ID="${{ secrets.GOOGLE_WEB_CLIENT_ID }}" \
            --stacktrace \
            --no-daemon

      - name: Package APK and source
        shell: bash
        run: |
          set -euo pipefail
          cp android-app/app/build/outputs/apk/debug/app-debug.apk VyaparAI-6.8.0.2026.apk
          git archive --format=zip --output=Vyapar-AI-6.8.0.2026-NonMain-Source.zip HEAD
          ls -lh VyaparAI-6.8.0.2026.apk Vyapar-AI-6.8.0.2026-NonMain-Source.zip

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VyaparAI-6.8.0.2026-nonmain-apk
          path: VyaparAI-6.8.0.2026.apk

      - name: Create non-main GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.8.0.2026-nonmain
          name: Vyapar AI v6.8.0.2026 - English Colorful (Non-Main)
          target_commitish: release/v6.8.0.2026-english-colorful
          body_path: RELEASE_6.8.0.2026.md
          files: |
            VyaparAI-6.8.0.2026.apk
            Vyapar-AI-6.8.0.2026-NonMain-Source.zip
