name: Apply Vyapar AI 6.5.9 profit and footer update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-profit-659.yml'
      - '.profit659-transfer/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified 6.5.9 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .profit659-transfer/v659.patch.xz.b64 > /tmp/v659.patch.xz
          xz -dc /tmp/v659.patch.xz > /tmp/v659.patch
          patch -p2 --forward --batch < /tmp/v659.patch

      - name: Validate frontend and Android bundle
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const v=JSON.parse(fs.readFileSync('version.json','utf8'));
          if(v.versionName!=='6.5.9'||Number(v.versionCode)!==65900) throw new Error('Version mismatch');
          const g=fs.readFileSync('android-app/app/build.gradle','utf8');
          if(!/versionCode\s+65900/.test(g)||!/versionName\s+['"]6\.5\.9['"]/.test(g)) throw new Error('Android version mismatch');
          NODE
          for f in web/*.js android-app/app/src/main/assets/*.js; do node --check "$f"; done
          grep -q 'profit-footer-659.js' web/index.html
          grep -q 'profit-footer-659.js' android-app/app/src/main/assets/index.html
          grep -q 'Combined Yearly Profit' PROFIT_FOOTER_6.5.9.md
          ! grep -q 'android-sheet-legal' web/app.js
          ! grep -q 'android-sheet-legal' android-app/app/src/main/assets/app.js
          for f in web/privacy.html web/terms.html web/refund.html web/delete-account.html; do grep -q 'footer-logo.png' "$f"; done

      - name: Commit clean 6.5.9 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .profit659-transfer .github/workflows/apply-profit-659.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release Vyapar AI 6.5.9 unified yearly profit and footer'
          git push origin HEAD:main
