<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vyapar AI Invoice</title><style>body{margin:0;font-family:system-ui;background:#090d12;color:#eef3f7}.wrap{max-width:820px;margin:auto;padding:18px}.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:20px;backdrop-filter:blur(18px)}table{width:100%;border-collapse:collapse;margin-top:16px}th,td{padding:10px;border-bottom:1px solid rgba(255,255,255,.1);text-align:left}.total{font-size:22px;font-weight:800;text-align:right;margin-top:18px}.muted{opacity:.7}.bad{color:#ff8b8b}.legacy{margin-top:16px;text-align:center;font-weight:850;font-style:italic;letter-spacing:.025em;color:#cfe1f3}</style></head><body><main class="wrap"><div id="app" class="card">Loading secure invoice...</div><div class="legacy">From: Gupta Legacy</div></main><script>
function e(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function num(v){const x=Number(v);return Number.isFinite(x)?x:0}
(async()=>{const el=document.getElementById('app'),t=new URLSearchParams(location.search).get('t');if(!t){el.innerHTML='<b class="bad">Invalid invoice link.</b>';return}try{const r=await fetch('https://vypar-backend.onrender.com/public/invoice/'+encodeURIComponent(t));const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||'Invoice unavailable');const i=d.invoice||{},items=Array.isArray(i.items)?i.items:[];el.innerHTML=`<h1>${e(i.businessName||'Vyapar AI')} Invoice</h1><div class="muted">Read-only secure invoice</div><h2>${e(i.number||'Invoice')}</h2><p>Date: ${e(i.date||'')}<br>Party: ${e(i.partyName||i.customer||'Walk-in Customer')}<br>Payment: ${e(i.paymentMode||'')}<br>Currency: ${e(i.currency||'INR')}</p><table><thead><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Tax</th></tr></thead><tbody>${items.map(x=>`<tr><td>${e(x.name||x.product||'')}</td><td>${num(x.qty)}</td><td>${e(i.currency||'INR')} ${num(x.rate||x.price).toFixed(2)}</td><td>${num(x.tax||x.gst)}%</td></tr>`).join('')}</tbody></table><div class="total">Total ${e(i.currency||'INR')} ${num(i.total).toFixed(2)}</div><p>Received: ${e(i.currency||'INR')} ${num(i.receivedPaid).toFixed(2)}<br>Balance: ${e(i.currency||'INR')} ${num(i.balance).toFixed(2)}</p>`}catch(err){el.innerHTML='<b class="bad">'+e(err.message)+'</b>'}})();
</script></body></html>
