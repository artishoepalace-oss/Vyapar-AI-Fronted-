  <meta name="apple-mobile-web-app-capable" content="yes" />

  <script>
    try {
      const ua = navigator.userAgent || "";
      const hasAndroidBridge = Boolean(window.AndroidApp);
      const isAndroidWebView = /;\s*wv\)/i.test(ua) || /\bwv\b/i.test(ua);
      const isNativeAndroid = hasAndroidBridge || isAndroidWebView;
      const viewportWidth = Math.max(320, window.innerWidth || document.documentElement.clientWidth || 1024);
      const coarsePointer = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
      const isMobileWeb = !isNativeAndroid && (viewportWidth <= 700 || (viewportWidth <= 900 && coarsePointer));

      document.documentElement.classList.add("vy861-flat-black");
      document.documentElement.classList.add(isNativeAndroid ? "native-android" : "web-ui");
      if (isNativeAndroid) document.documentElement.classList.add("android-ui");
      if (!isNativeAndroid) document.documentElement.classList.add(isMobileWeb ? "mobile-web" : "desktop-web");

      const saved = JSON.parse(localStorage.getItem("vyapar_ai_prod_v1") || "{}");
      if (saved && saved.settings && saved.settings.theme === "light") {
        document.documentElement.classList.add("theme-light");
        document.documentElement.style.colorScheme = "light";
        document.documentElement.style.background = "#f5f5f7";
        document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f5f5f7");
      }
    } catch (error) {}
  </script>

  <script id="vy865-nav-guard">
/* Vyapar AI 8.6.5 — viewport-safe monochrome runtime guard. */
(() => {
  'use strict';
  const fix = () => {
    const nav = document.querySelector('#nav.nav, .nav');
    if (nav) {
      if (document.body && nav.parentElement !== document.body) document.body.appendChild(nav);
      ['left','right','top','bottom','width','min-width','max-width','height','transform','translate','margin','margin-left','margin-right'].forEach((p) => nav.style.removeProperty(p));
      nav.scrollLeft = 0;
    }
  };
  let queued = false;
  const schedule = () => {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; fix(); });
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fix, { once: true });
  else fix();
  new MutationObserver(schedule).observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['style','src','class'] });
  addEventListener('resize', schedule, { passive: true });
})();

  </script>
