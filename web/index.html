<!DOCTYPE html>
<html lang="en" class="vy-professional-ui">
<head>
  <meta charset="UTF-8" />
  <meta name="vyapar-ui-version" content="8.5.4.2026" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" href="assets/images/logo.png" type="image/x-icon">
  <title>Vyapar AI</title>
  <meta name="description" content="Sales, stock, profit and business insights for small retailers." />
  <meta name="theme-color" content="#07101d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <script>
    try {
      const ua = navigator.userAgent || "";
      const hasAndroidBridge = Boolean(window.AndroidApp);
      const isAndroidWebView = /;\s*wv\)/i.test(ua) || /\bwv\b/i.test(ua);
      const isNativeAndroid = hasAndroidBridge || isAndroidWebView;
      const viewportWidth = Math.max(320, window.innerWidth || document.documentElement.clientWidth || 1024);
      const coarsePointer = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
      const isMobileWeb = !isNativeAndroid && (viewportWidth <= 700 || (viewportWidth <= 900 && coarsePointer));

      document.documentElement.classList.add(isNativeAndroid ? "native-android" : "web-ui");
      if (isNativeAndroid) document.documentElement.classList.add("android-ui");
      if (!isNativeAndroid) document.documentElement.classList.add(isMobileWeb ? "mobile-web" : "desktop-web");

      const saved = JSON.parse(localStorage.getItem("vyapar_ai_prod_v1") || "{}");
      if (saved && saved.settings && saved.settings.theme === "light") {
        document.documentElement.classList.add("theme-light");
        document.documentElement.style.colorScheme = "light";
        document.documentElement.style.background = "#eff6fb";
        document.querySelector('meta[name="theme-color"]').setAttribute("content", "#edf4fb");
      }
    } catch (error) {}
  </script>
  <link rel="stylesheet" href="assets/styles/vyapar-core.css?v=20260906-unified854" />
  <link rel="stylesheet" href="assets/styles/vyapar-ui.css?v=20260906-unified854" />
</head>
<body>
  <div id="appLoader" class="android-loader" aria-label="Loading Vyapar AI">
    <div class="android-loader-logo" aria-hidden="true">
      <img src="assets/images/logo.png" alt="" />
      <span class="android-loader-shine"></span>
      <i class="android-loader-spark spark-a"></i>
      <i class="android-loader-spark spark-b"></i>
    </div>
    <strong>Vyapar AI</strong>
    <div class="android-loader-bar"><span></span></div>
  </div>

  <div id="tabLoader">
    <div class="tab-loader-card">
      <div class="tab-loader-dot"></div>
      <div class="tab-loader-text">Loading</div>
    </div>
  </div>

  <div class="app">
    <header class="top">
      <div class="brand">
        <img class="logo" src="assets/images/logo.png" alt="Vyapar AI" />
        <div>
          <h1>Vyapar AI</h1>
          <div class="tag">Clear business overview</div>
        </div>
      </div>
      <div class="top-actions">
        <div class="badge" id="planBadge">Free Plan</div>
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme(event)" type="button" aria-label="Change appearance">Theme</button>
      </div>
    </header>

    <main>
      <section id="screen-home" class="screen"></section>
      <section id="screen-upload" class="screen hide"></section>
      <section id="screen-sales" class="screen hide"></section>
      <section id="screen-stock" class="screen hide"></section>
      <section id="screen-analytics" class="screen hide"></section>
      <section id="screen-calculator" class="screen hide"></section>
      <section id="screen-business" class="screen hide"></section>
      <section id="screen-subscription" class="screen hide"></section>
      <section id="screen-settings" class="screen hide"></section>
    </main>

    <nav class="nav" id="nav" aria-label="Main navigation"></nav>
  </div>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="assets/scripts/vyapar-app.js?v=20260906-unified854"></script>
</body>
</html>
