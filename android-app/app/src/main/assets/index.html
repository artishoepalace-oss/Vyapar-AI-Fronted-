<!DOCTYPE html>
<html lang="en" class="vy-professional-ui vy855-stable-ios vy855-inspected-fix vy855-liquid-lens vy857-ios27 vy855-booting">
<head>
  <meta charset="UTF-8" />
  <meta name="vyapar-ui-version" content="8.5.6.2026" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" href="assets/images/logo.png" type="image/x-icon">
  <title>Vyapar AI</title>
  <meta name="description" content="Sales, stock, profit and business insights for small retailers." />
  <meta name="theme-color" content="#06172D" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="preconnect" href="https://checkout.razorpay.com" crossorigin />
  <style>
    html, body { margin: 0; min-height: 100%; background: #06172D; }
    html.theme-light, html.theme-light body { background: #eff6fb; }

    /* WebView first-paint continuity. This exists before the bundled CSS/JS so
       a slow Android 8 device never exposes the raw white document surface. */
    #vy855BootGuard{
      position:fixed;
      inset:0;
      z-index:2147483600;
      display:grid;
      place-items:center;
      background:#06172D;
      opacity:1;
      visibility:visible;
      pointer-events:auto;
      transition:opacity .10s linear;
    }
    html.theme-light #vy855BootGuard{background:#eff6fb;}
    #vy855BootGuard.is-ready{opacity:0;pointer-events:none;}
    #vy855BootGuard img{
      width:92px;
      height:92px;
      border-radius:50%;
      clip-path:circle(50%);
      -webkit-clip-path:circle(50%);
      object-fit:contain;
      background:#fff;
      box-shadow:0 12px 30px rgba(0,0,0,.16);
    }
    html.vy855-booting #appLoader,
    html.vy855-booting #vy647StartupSplash{
      opacity:0!important;
      visibility:hidden!important;
      pointer-events:none!important;
    }
  </style>
  <script>
    try {
      document.documentElement.classList.add("android-ui", "native-android", "vy855-stable-ios", "vy855-inspected-fix", "vy855-liquid-lens", "vy857-ios27", "vy855-booting");
      document.documentElement.style.background = "#06172D";
      const saved = JSON.parse(localStorage.getItem("vyapar_ai_prod_v1") || "{}");
      if (saved && saved.settings && saved.settings.theme === "light") {
        document.documentElement.classList.add("theme-light");
        document.documentElement.style.colorScheme = "light";
        document.documentElement.style.background = "#eff6fb";
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", "#eff6fb");
      }
    } catch (error) {}
  </script>
  <link rel="stylesheet" href="assets/styles/vyapar-core.css?v=20260906-ios27-857-1" />
  <link rel="stylesheet" href="assets/styles/vyapar-ui.css?v=20260906-ios27-857-1" />
</head>
<body>
  <div id="vy855BootGuard" aria-hidden="true"><img src="assets/images/logo.png" alt="" /></div>

  <div id="appLoader" class="android-loader" aria-label="Loading Vyapar AI">
    <div class="android-loader-logo" aria-hidden="true">
      <img src="assets/images/logo.png" alt="" />
      <span class="android-loader-shine"></span>
      <i class="android-loader-spark spark-a"></i>
      <i class="android-loader-spark spark-b"></i>
    </div>
    <strong>Vyapar AI</strong>
    <div class="android-loader-bar"><span></span></div>
  </div>

  <div id="tabLoader">
    <div class="tab-loader-card">
      <div class="tab-loader-dot"></div>
      <div class="tab-loader-text">Loading</div>
    </div>
  </div>

  <div class="app">
    <header class="top">
      <div class="brand">
        <img class="logo" src="assets/images/logo.png" alt="Vyapar AI" />
        <div>
          <h1>Vyapar AI</h1>
          <div class="tag">Clear business overview</div>
        </div>
      </div>
      <div class="top-actions">
        <div class="badge" id="planBadge">Free Plan</div>
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme(event)" type="button" aria-label="Change appearance">Theme</button>
      </div>
    </header>

    <main>
      <section id="screen-home" class="screen"></section>
      <section id="screen-upload" class="screen hide"></section>
      <section id="screen-sales" class="screen hide"></section>
      <section id="screen-stock" class="screen hide"></section>
      <section id="screen-analytics" class="screen hide"></section>
      <section id="screen-calculator" class="screen hide"></section>
      <section id="screen-business" class="screen hide"></section>
      <section id="screen-subscription" class="screen hide"></section>
      <section id="screen-settings" class="screen hide"></section>
    </main>

    <nav class="nav" id="nav" aria-label="Main navigation"></nav>
  </div>

  <script async src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="assets/scripts/vyapar-app.js?v=20260906-ios27-857-1"></script>
  <script>
    /* Failsafe only: the bundled fix normally removes this as soon as real UI
       paints. Never leave a permanent guard if an unrelated script fails. */
    setTimeout(function(){
      var guard=document.getElementById('vy855BootGuard');
      if(guard){guard.classList.add('is-ready');setTimeout(function(){if(guard.parentNode)guard.parentNode.removeChild(guard);},140);}
      document.documentElement.classList.remove('vy855-booting');
    },3200);
  </script>
</body>
</html>
