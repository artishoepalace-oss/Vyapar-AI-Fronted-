plugins { id 'com.android.application' }

def googleWebClientId = (project.findProperty("GOOGLE_WEB_CLIENT_ID") ?: System.getenv("GOOGLE_WEB_CLIENT_ID") ?: "").toString()
def cmakeConfig = file('src/main/cpp/CMakeLists.txt')
def ndkBuildConfig = file('src/main/jni/Android.mk')
def hasNativeBuild = cmakeConfig.exists() || ndkBuildConfig.exists()
def updateKeystore = System.getenv('VYAPAR_SIGNING_STORE_FILE')

android {
    namespace 'com.vyaparai.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.anuj.guptalegacy.vyaparai'
        minSdk 23
        targetSdk 34
        resValue "string", "google_web_client_id", googleWebClientId
        versionCode 2010200419
        versionName "20.10.2004.00019.2026"

        if (cmakeConfig.exists()) {
            externalNativeBuild {
                cmake {
                    cppFlags '-std=c++17'
                }
            }
        }
    }

    if (hasNativeBuild) {
        ndkVersion '26.1.10909125'
    }

    if (cmakeConfig.exists()) {
        externalNativeBuild {
            cmake {
                path cmakeConfig
                version '3.22.1'
            }
        }
    } else if (ndkBuildConfig.exists()) {
        externalNativeBuild {
            ndkBuild {
                path ndkBuildConfig
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Reuse the ORIGINAL installed app key. Never generate a new key for an update.
    if (updateKeystore) {
        signingConfigs {
            updateKey {
                storeFile file(updateKeystore)
                storePassword System.getenv('VYAPAR_SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('VYAPAR_SIGNING_KEY_ALIAS')
                keyPassword System.getenv('VYAPAR_SIGNING_KEY_PASSWORD')
            }
        }
        buildTypes {
            debug { signingConfig signingConfigs.updateKey }
            release { signingConfig signingConfigs.updateKey }
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-auth:21.6.0'
}
