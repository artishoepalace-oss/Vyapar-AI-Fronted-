plugins { id 'com.android.application' }

def googleWebClientId = (project.findProperty("GOOGLE_WEB_CLIENT_ID") ?: System.getenv("GOOGLE_WEB_CLIENT_ID") ?: "").toString()
def cmakeConfig = file('src/main/cpp/CMakeLists.txt')
def ndkBuildConfig = file('src/main/jni/Android.mk')
def hasNativeBuild = cmakeConfig.exists() || ndkBuildConfig.exists()

android {
    namespace 'com.vyaparai.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.anuj.guptalegacy.vyaparai'
        minSdk 23
        targetSdk 34
        resValue "string", "google_web_client_id", googleWebClientId
        versionCode 8512026
        versionName "8.5.1.2026"

        if (cmakeConfig.exists()) {
            externalNativeBuild {
                cmake {
                    cppFlags '-std=c++17'
                }
            }
        }
    }

    if (hasNativeBuild) {
        ndkVersion '26.1.10909125'
    }

    if (cmakeConfig.exists()) {
        externalNativeBuild {
            cmake {
                path cmakeConfig
                version '3.22.1'
            }
        }
    } else if (ndkBuildConfig.exists()) {
        externalNativeBuild {
            ndkBuild {
                path ndkBuildConfig
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-auth:21.6.0'
}
